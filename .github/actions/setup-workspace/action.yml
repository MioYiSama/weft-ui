name: Set up the workspace
description: Node.js and pnpm, the installed workspace, and the compiler WASM of the wasm job.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        # Keep in sync with native/linux/docker/Dockerfile.
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: actions/download-artifact@v8
      with:
        name: compiler-wasm
        path: packages/compiler/wasm
