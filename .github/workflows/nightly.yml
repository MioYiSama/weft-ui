# The example's UI flows on the Android emulator and the iOS simulator, once a
# day and on demand. The Windows flow (FlaUI, needs an interactive desktop) and
# the Linux flow (VNC desktop in the container) still run only locally; see
# CONTRIBUTING.md.
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with crates/wasm/Cargo.toml.
  WASM_BINDGEN: 0.2.130
  # Keep in sync with WEFT_HERMES_TAG in native/core/CMakeLists.txt. The kernel
  # caches are keyed on it and on the Hermes options in native/core/hermes.cmake.
  HERMES_TAG: hermes-v260318099.0.8

jobs:
  # A scheduled run is skipped when master has not moved since the last
  # successful nightly run; manual runs always go ahead.
  changed:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --branch master --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "master is still at $last, which passed the last nightly run"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  wasm:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - run: cargo build -p weft-ui-wasm --release --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir packages/compiler/wasm --out-name weft_ui_wasm target/wasm32-unknown-unknown/release/weft_ui_wasm.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: packages/compiler/wasm
          retention-days: 3

  android-ui:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/android/build
          key: android-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/android/CMakeLists.txt', 'native/android/build-core.sh') }}
          restore-keys: android-${{ env.HERMES_TAG }}-
      - run: native/android/build-core.sh
        env:
          WEFT_ANDROID_ABIS: x86_64
      - run: pnpm --filter example build:android
        env:
          WEFT_NATIVE: "0"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: pnpm --filter example test:android

  ios-ui:
    needs: wasm
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: brew install ninja
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/apple/build
          key: apple-ios-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/apple/build-core.sh') }}
          restore-keys: apple-ios-${{ env.HERMES_TAG }}-
      - run: native/apple/build-core.sh
        env:
          WEFT_APPLE_SDKS: iphonesimulator
      - run: pnpm --filter example build:ios
        env:
          WEFT_NATIVE: "0"
      - run: pnpm --filter example test:ios
