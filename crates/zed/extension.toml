id = "weft"
name = "Weft"
version = "0.0.1"
schema_version = 1
authors = ["MioYiSama"]
description = "Weft UI (.weft) support: syntax highlighting, plus diagnostics, completion, hover, go to definition and formatting through `weft lsp`"

[language_servers.weft]
name = "Weft Language Server"
languages = ["Weft"]

# Zed clones this commit and builds `path`; point `rev` at the latest commit that changed the grammar.
[grammars.weft]
repository = "https://github.com/MioYiSama/weft-ui"
rev = "cbd7ab6d6c1d67ea2ce978ec76c7a718ba641011"
path = "packages/tree-sitter"
