[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/weft-ui/weft-ui"

[workspace]
resolver = "3"
members = ["crates/*"]
# Built by Zed for wasm32-wasip2 with its own lockfile and target directory.
exclude = ["crates/zed"]

# The ICU4X backend is linked into the prebuilt Linux kernel.
[profile.kernel]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
