[package]
name = "weft-ui-unicode"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "ICU4X Unicode backend for the Weft UI Linux kernel"

[lib]
crate-type = ["staticlib"]

[dependencies]
arrayvec = "0.7"
calendrical_calculations = "0.2"
icu_calendar = "2.4"
icu_casemap = "2.4"
icu_collator = "2.4"
icu_datetime = "2.4"
icu_locale_core = "2.4"
icu_normalizer = "2.4"
icu_provider = { version = "2.4", features = ["sync"] }
write16 = "1"
writeable = "0.6"
