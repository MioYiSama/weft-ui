[package]
name = "weft-ui-cli"
version = { workspace = true }
edition = { workspace = true }
description = "Command-line tools for Weft UI: formatter and language server"

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
weft-ui-ast = { path = "../ast" }
weft-ui-formatter = { path = "../formatter" }
weft-ui-language-server = { path = "../language-server" }
